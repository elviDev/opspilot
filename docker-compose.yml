version: "3.9"
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: opspilot
    ports:
      - "5442:5432"
    volumes:
      - opspilot_pgdata:/var/lib/postgresql/data

volumes:
  opspilot_pgdata: