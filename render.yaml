services:
  - type: web
    name: opspilot-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: opspilot-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://opspilot-delta.vercel.app
      - key: GEMINI_API_KEY
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: CHECK_INTERVAL_SECONDS
        value: "60"
      - key: FAILURE_THRESHOLD
        value: "2"

databases:
  - name: opspilot-db
    plan: free
